---
layout: default
---

<article class="post-content">
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
  </header>

  {{ content }}

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">Back to posts</a>
    <button class="post-share-button" type="button" data-share-url="{{ page.url | relative_url }}" aria-label="Share this post" title="Share this post">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="M4 12v8h16v-8"></path>
        <path d="M12 16V4"></path>
        <path d="m7 9 5-5 5 5"></path>
      </svg>
      <span class="post-share-status" aria-live="polite"></span>
    </button>
  </footer>
</article>
