<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% feed_meta %}
    {% seo %}
    <link rel="stylesheet" href="https://use.typekit.net/ing8yff.css">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    <header class="site-topbar">
      <div class="site-nav-wrap">
        <a class="site-parent-link" href="https://jasonteaches.com/" target="_blank" rel="noopener">jasonteaches.com</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/archive/' | relative_url }}">Archive</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/follow/' | relative_url }}">Follow</a>
        </nav>
        <details class="mobile-nav">
          <summary aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
          </summary>
          <nav aria-label="Mobile navigation">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/archive/' | relative_url }}">Archive</a>
            <a href="{{ '/about/' | relative_url }}">About</a>
            <a href="{{ '/follow/' | relative_url }}">Follow</a>
          </nav>
        </details>
      </div>
    </header>

    <div class="site-shell">
      <main class="site-main">
        {{ content }}
      </main>
    </div>
    <script src="{{ '/assets/js/footer-flowers.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/post-share.js' | relative_url }}"></script>
  </body>
</html>
